# =============================================================================
# handeye_capture 采集程序参数
# =============================================================================

# ---------------------------------------------------------------- 相机（Orbbec）
camera:
  width: 640
  height: 480
  fps: 30
  format: MJPG
  warmup_frames: 10     # 打开后先丢弃的帧数，等自动曝光稳定

# ---------------------------------------------------------------- 标定板
board:
  cols: 8               # 内角点列数（横向 9 格 -> 8 个内角点）
  rows: 6               # 内角点行数（纵向 7 格 -> 6 个内角点）
  square_size_m: 0.025  # 方格边长，单位米（25 mm）

# ---------------------------------------------------------------- 机械臂
robot:
  ip: 192.168.1.18
  port: 8080

# ---------------------------------------------------------------- 样本输出
session:
  root: samples         # 样本根目录，相对路径相对于运行目录
  name: ""              # 留空 -> 自动 session_YYYYMMDD_HHMM

# ---------------------------------------------------------------- 采集判定
capture:
  max_reprojection_px: 1.0    # 单帧重投影 RMS 上限，超过则拒绝采集
  min_pose_distance_m: 0.005  # 与已有样本的最小位置差（米），低于则视为重复姿态
  min_pose_angle_deg: 5.0     # 与已有样本的最小姿态差（度）
